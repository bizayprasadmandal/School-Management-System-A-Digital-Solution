<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="EduSphere — Comprehensive School Management System for students, teachers, parents and administrators." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EduSphere" />

    <!-- Open Graph -->
    <meta property="og:title" content="EduSphere School Management System" />
    <meta property="og:description" content="Manage students, attendance, grades, fees and communication in one place." />
    <meta property="og:type" content="website" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>EduSphere — School Management System</title>

    <style>
      /* Inline critical CSS to prevent flash of unstyled content */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      #root { height: 100%; }

      /* Loading screen shown before React mounts */
      #app-loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #312e81; gap: 20px;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loading.hidden { opacity: 0; pointer-events: none; }
      #app-loading .logo {
        width: 72px; height: 72px; border-radius: 20px;
        background: #fff; display: flex; align-items: center; justify-content: center;
        font-size: 36px;
      }
      #app-loading h1 { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
      #app-loading p { color: #a5b4fc; font-size: 14px; }
      #app-loading .spinner {
        width: 36px; height: 36px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding:40px;text-align:center;font-family:sans-serif;">
        <h2>JavaScript Required</h2>
        <p>EduSphere requires JavaScript to run. Please enable it in your browser settings.</p>
      </div>
    </noscript>

    <!-- Loading screen (hidden once React mounts) -->
    <div id="app-loading">
      <div class="logo">🎓</div>
      <h1>EduSphere</h1>
      <p>School Management System</p>
      <div class="spinner"></div>
    </div>

    <div id="root"></div>

    <script>
      // Hide loading screen once React app mounts
      window.__hideLoader = function() {
        var el = document.getElementById("app-loading");
        if (el) {
          el.classList.add("hidden");
          setTimeout(function() { el.remove(); }, 400);
        }
      };
    </script>
  </body>
</html>
