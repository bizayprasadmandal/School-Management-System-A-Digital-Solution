[pytest]
DJANGO_SETTINGS_MODULE = core.settings.base
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    --no-header
    -q
    --timeout=120
    --strict-markers
    --tb=short
# Time only the test body, not setup/teardown: a cold --create-db build
# (~500 migrations x ~930 models) can exceed 120s on a slow host and would
# otherwise error every test at django_db_setup.
timeout_func_only = true

markers =
    slow: mark test as slow (>5s) — use -m "not slow" for quick runs
    slow_axes: Axes lockout tests that require time mocking
    integration: mark as integration test
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
