name: Backend CI

on:
  push:
    branches: [master, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sms_test
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Check for pending migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run --settings=core.settings.base
        env:
          SECRET_KEY: test-key-not-for-production
          DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: "False"

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --settings=core.settings.base
        env:
          SECRET_KEY: test-key-not-for-production
          DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: "False"

      - name: Run tests
        run: |
          cd backend
          python -m pytest --ds=core.settings.base --tb=short -x --cov=services --cov-report=term
        env:
          SECRET_KEY: test-key-not-for-production
          DATABASE_URL: postgresql://sms:sms@localhost:5432/sms_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: "False"

      - name: Lint with flake8
        run: |
          cd backend
          flake8 services core --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check import sorting
        run: |
          cd backend
          isort --check-only --diff services core tests
