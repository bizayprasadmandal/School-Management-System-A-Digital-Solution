name: Full CI/CD — EduSphere SMS
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sms_test, POSTGRES_USER: sms, POSTGRES_PASSWORD: test_password }
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://sms:test_password@localhost:5432/sms_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: pytest tests/ --tb=short --timeout=120 -m "not slow" --cov=services --cov-fail-under=65 -q

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          { node-version: "20", cache: npm, cache-dependency-path: frontend/web/package-lock.json }
      # react-scripts 5 pins TypeScript <5 as a peer dependency while the
      # project uses TS 5.x — npm ci needs the same flag the Dockerfile uses.
      - run: npm ci --legacy-peer-deps
        working-directory: frontend/web
      - run: npm run type-check
        working-directory: frontend/web
      - run: npm run lint
        working-directory: frontend/web
      - name: Run frontend tests
        working-directory: frontend/web
        run: npx react-scripts test --watchAll=false --passWithNoTests
      - name: Build
        working-directory: frontend/web
        env: { REACT_APP_API_URL: https://api.example.com/api/v1, CI: "false" }
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secrets — hard gate. Scans full history; fails on any detected secret.
      # Uses the OSS gitleaks CLI image (no license required). Config in
      # .gitleaks.toml allowlists intentional dev/demo values.
      - name: Gitleaks — secret leak scan
        uses: docker://zricethezav/gitleaks:v8.18.4
        with:
          args: detect --source . --redact --verbose

      # Python dependency CVEs — fail only on CRITICAL. Highs are printed in
      # the log every run and tracked against the Django 5.2 upgrade backlog.
      - name: pip-audit — Python dependency CVEs
        run: |
          python -m pip install --quiet pip-audit
          cd backend
          python -m pip_audit -r requirements.txt --fail-on=critical

      # Python static security analysis — hard gate (medium+ findings).
      # .bandit.yaml (skips + excludes) is auto-discovered from the repo root.
      - name: Bandit — Python static security analysis
        run: |
          python -m pip install --quiet bandit
          python -m bandit -r backend/services -ll -q -x migrations,tests

      # JS dependency CVEs — fail only on CRITICAL (CRA toolchain noise is
      # tracked against the Vite migration; all highs are printed below).
      - name: npm audit — JS dependency CVEs
        working-directory: frontend/web
        run: npm audit --audit-level=critical

  docker-build:
    needs: [backend-test, frontend-test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: infrastructure/docker/backend/Dockerfile
          target: production
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }},${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          # Build from the repo root so the Dockerfile can COPY the nginx
          # config and entrypoint that live under infrastructure/.
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          target: production
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }},${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
            REACT_APP_WS_URL=${{ secrets.REACT_APP_WS_URL }}

  deploy-production:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: { name: production, url: "https://app.edusphere.school" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with: { method: kubeconfig, kubeconfig: "${{ secrets.KUBE_CONFIG_PRODUCTION }}" }
      - name: Check pending migrations
        run: |
          kubectl exec deploy/sms-backend -n sms -- python manage.py migrate --check || {
            echo "⚠️ Pending migrations detected! Running migrate..."
            kubectl exec deploy/sms-backend -n sms -- python manage.py migrate --noinput
          }
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/sms-backend backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} -n sms
          kubectl set image deployment/sms-frontend frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -n sms
          kubectl rollout status deployment/sms-backend -n sms --timeout=5m
          kubectl rollout status deployment/sms-frontend -n sms --timeout=3m
          echo "✅ Deployed ${{ github.sha }} to production"
