name: Full CI/CD — EduSphere SMS
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# GHCR rejects uppercase characters in image names, but github.repository
# (e.g. .../School-Management-System-A-Digital-Solution) can contain them and
# can't be lowercased via GitHub expression syntax. Each job that builds or
# deploys images computes the slugged IMAGE_BASE via a shell step.

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sms_test, POSTGRES_USER: sms, POSTGRES_PASSWORD: test_password }
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://sms:test_password@localhost:5432/sms_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      # Fail the build if model changes aren't captured in migrations. This
      # prevents shipping a schema drift that would only surface at deploy.
      - name: Check no pending migrations
        working-directory: backend
        run: python manage.py makemigrations --check
      - name: Run tests
        working-directory: backend
        run: pytest tests/ --tb=short --timeout=120 -m "not slow" --cov=services --cov-fail-under=65 -q

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: sms_test, POSTGRES_USER: sms, POSTGRES_PASSWORD: test_password }
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://sms:test_password@localhost:5432/sms_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with:
          { node-version: "20", cache: npm, cache-dependency-path: frontend/web/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: npm ci --legacy-peer-deps
        working-directory: frontend/web
      - name: Install Playwright browsers
        working-directory: frontend/web
        run: npx playwright install --with-deps chromium
      - name: Migrate + seed database
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e_data
      # daphne (not runserver) so both HTTP and the app's WebSocket connections
      # are served, matching production ASGI behavior.
      - name: Start backend (daphne)
        working-directory: backend
        run: |
          daphne -b 0.0.0.0 -p 8000 core.asgi:application > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/live/ > /dev/null 2>&1; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"; tail -50 /tmp/backend.log; exit 1
      - name: Start frontend dev server
        working-directory: frontend/web
        run: |
          BROWSER=none npm start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 180); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "frontend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Frontend failed to start"; tail -50 /tmp/frontend.log; exit 1
      - name: Run Playwright e2e tests
        working-directory: frontend/web
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/web/playwright-report
          retention-days: 7
      - name: Stop servers
        if: always()
        run: kill $(cat /tmp/backend.pid) $(cat /tmp/frontend.pid) 2>/dev/null || true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          { node-version: "20", cache: npm, cache-dependency-path: frontend/web/package-lock.json }
      # react-scripts 5 pins TypeScript <5 as a peer dependency while the
      # project uses TS 5.x — npm ci needs the same flag the Dockerfile uses.
      - run: npm ci --legacy-peer-deps
        working-directory: frontend/web
      - run: npm run type-check
        working-directory: frontend/web
      - run: npm run lint
        working-directory: frontend/web
      - name: Run frontend tests
        working-directory: frontend/web
        run: npx react-scripts test --watchAll=false --passWithNoTests
      - name: Build
        working-directory: frontend/web
        env: { REACT_APP_API_URL: https://api.example.com/api/v1, CI: "false" }
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secrets — hard gate. Scans full history; fails on any detected secret.
      # Uses the OSS gitleaks CLI image (no license required). Config in
      # .gitleaks.toml allowlists intentional dev/demo values. The container
      # runs git as root against a runner-owned checkout, so safe.directory
      # is injected via GIT_CONFIG_* env vars (otherwise the scan is a no-op).
      - name: Gitleaks — secret leak scan
        uses: docker://zricethezav/gitleaks:v8.18.4
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: detect --source . --redact --verbose

      # Python dependency CVEs — REPORT ONLY (never blocks). pip-audit's newer
      # releases removed the --fail-on flag, and Django 4.2 (EOL) carries known
      # high-severity CVEs, so a hard gate would be permanently red. The full
      # report prints here every run; convert to a hard gate after the Django
      # 5.2 upgrade.
      - name: pip-audit — Python dependency CVEs (report)
        run: |
          python -m pip install --quiet pip-audit
          cd backend
          echo "::group::pip-audit report"
          python -m pip_audit -r requirements.txt || true
          echo "::endgroup::"

      # Python static security analysis — hard gate (medium+ findings).
      # .bandit.yaml (skips + excludes) is auto-discovered from the repo root.
      - name: Bandit — Python static security analysis
        run: |
          python -m pip install --quiet bandit
          python -m bandit -r backend/services -ll -q -x migrations,tests

      # JS dependency CVEs — fail only on CRITICAL (CRA toolchain noise is
      # tracked against the Vite migration; all highs are printed below).
      - name: npm audit — JS dependency CVEs
        working-directory: frontend/web
        run: npm audit --audit-level=critical

  docker-build:
    needs: [backend-test, frontend-test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      # GHCR requires lowercase image names — slug the repo name via the shell.
      - name: Slug GHCR image base (lowercase)
        run: |
          echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: infrastructure/docker/backend/Dockerfile
          target: production
          push: true
          tags: ${{ env.IMAGE_BASE }}/backend:${{ github.sha }},${{ env.IMAGE_BASE }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          # Build from the repo root so the Dockerfile can COPY the nginx
          # config and entrypoint that live under infrastructure/.
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          target: production
          push: true
          tags: ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }},${{ env.IMAGE_BASE }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
            REACT_APP_WS_URL=${{ secrets.REACT_APP_WS_URL }}

  deploy-production:
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: { name: production, url: "https://app.edusphere.school" }
    steps:
      - uses: actions/checkout@v4
      - name: Slug GHCR image base (lowercase)
        run: |
          echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with: { method: kubeconfig, kubeconfig: "${{ secrets.KUBE_CONFIG_PRODUCTION }}" }
      - name: Check pending migrations
        run: |
          kubectl exec deploy/sms-backend -n sms -- python manage.py migrate --check || {
            echo "⚠️ Pending migrations detected! Running migrate..."
            kubectl exec deploy/sms-backend -n sms -- python manage.py migrate --noinput
          }
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/sms-backend backend=${{ env.IMAGE_BASE }}/backend:${{ github.sha }} -n sms
          kubectl set image deployment/sms-frontend frontend=${{ env.IMAGE_BASE }}/frontend:${{ github.sha }} -n sms
          kubectl rollout status deployment/sms-backend -n sms --timeout=5m
          kubectl rollout status deployment/sms-frontend -n sms --timeout=3m
          echo "✅ Deployed ${{ github.sha }} to production"
