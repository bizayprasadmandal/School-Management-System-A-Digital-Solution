name: Deploy Staging
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: sms_test, POSTGRES_USER: sms, POSTGRES_PASSWORD: sms }
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping" --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://sms:sms@localhost/sms_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: pytest --tb=short -q -m "not slow"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/web/package.json }
      # Vite has no peer-dep conflicts — plain npm ci works.
      - run: npm ci
        working-directory: frontend/web
      - name: TypeScript check
        working-directory: frontend/web
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: frontend/web
        run: npx eslint src/ --max-warnings 0
      - name: Frontend tests
        working-directory: frontend/web
        run: npx jest --watchAll=false

  build-and-deploy:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      # GHCR rejects uppercase characters in image names — slug the repo name.
      - name: Slug GHCR image base (lowercase)
        run: |
          echo "IMAGE_BASE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Guard: skipped until KUBE_CONFIG_STAGING is configured — image builds
      # above still run, and setting the secret activates the deploy steps.
      - name: Check kubeconfig secret is configured
        id: kubecheck
        run: |
          if [ -n "$KUBE_CONFIG_STAGING" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBE_CONFIG_STAGING secret is not set — skipping staging deploy. Add the secret to activate."
          fi
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
      - name: Configure kubectl
        if: steps.kubecheck.outputs.configured == 'true'
        uses: azure/k8s-set-context@v5
        with: { method: kubeconfig, kubeconfig: "${{ secrets.KUBE_CONFIG_STAGING }}" }

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: infrastructure/docker/backend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:staging
            ${{ env.IMAGE_BASE }}/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same silent-breakage guard as ci-full.yml: unset staging secrets would
      # bake empty URLs (app falls back to localhost:8000). Bake placeholder
      # defaults until the secrets are configured.
      - name: Resolve frontend build args (placeholder when secrets unset)
        id: fe-args
        run: |
          API="${VITE_API_URL_STAGING:-https://api.staging.example.com/api/v1}"
          WS="${VITE_WS_URL_STAGING:-https://api.staging.example.com}"
          SENTRY="${VITE_SENTRY_DSN_STAGING:-}"
          echo "api_url=$API" >> "$GITHUB_OUTPUT"
          echo "ws_url=$WS" >> "$GITHUB_OUTPUT"
          echo "sentry_dsn=$SENTRY" >> "$GITHUB_OUTPUT"
          echo "sentry_release=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          # if-blocks (not `[ -z ] && echo`) — under bash -e a short-circuited &&
          # line would exit 1 the moment the secrets ARE set, failing the build.
          if [ -z "$VITE_API_URL_STAGING" ]; then
            echo "::warning::VITE_API_URL_STAGING secret is not set — baking placeholder $API. Set it to bake real URLs."
          fi
          if [ -z "$VITE_WS_URL_STAGING" ]; then
            echo "::warning::VITE_WS_URL_STAGING secret is not set — baking placeholder $WS. Set it to bake real URLs."
          fi
        env:
          VITE_API_URL_STAGING: ${{ secrets.VITE_API_URL_STAGING }}
          VITE_WS_URL_STAGING: ${{ secrets.VITE_WS_URL_STAGING }}
          VITE_SENTRY_DSN_STAGING: ${{ secrets.VITE_SENTRY_DSN_STAGING }}
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          # Build from the repo root so the Dockerfile can COPY the nginx
          # config and entrypoint that live under infrastructure/.
          context: .
          file: infrastructure/docker/frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:staging
            ${{ env.IMAGE_BASE }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ steps.fe-args.outputs.api_url }}
            VITE_WS_URL=${{ steps.fe-args.outputs.ws_url }}
            VITE_SENTRY_DSN=${{ steps.fe-args.outputs.sentry_dsn }}
            VITE_SENTRY_RELEASE=${{ steps.fe-args.outputs.sentry_release }}

      - name: Migrate database
        if: steps.kubecheck.outputs.configured == 'true'
        run: |
          kubectl exec deploy/sms-backend-staging -n staging -- python manage.py migrate --noinput

      - name: Deploy to staging
        if: steps.kubecheck.outputs.configured == 'true'
        run: |
          kubectl set image deploy/sms-backend-staging \
            backend=${{ env.IMAGE_BASE }}/backend:${{ env.IMAGE_TAG }} \
            -n staging
          kubectl set image deploy/sms-frontend-staging \
            frontend=${{ env.IMAGE_BASE }}/frontend:${{ env.IMAGE_TAG }} \
            -n staging
          kubectl rollout status deploy/sms-backend-staging -n staging --timeout=5m
          kubectl rollout status deploy/sms-frontend-staging -n staging --timeout=5m

      - name: Collect static files
        if: steps.kubecheck.outputs.configured == 'true'
        run: |
          kubectl exec deploy/sms-backend-staging -n staging -- python manage.py collectstatic --noinput
