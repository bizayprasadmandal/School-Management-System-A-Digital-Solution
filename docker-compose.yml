services:
  # ─── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_db
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible) ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sms_admin
      MINIO_ROOT_PASSWORD: sms_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Django Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
      target: development
    container_name: sms_backend
    restart: unless-stopped
    # Use daphne — the Channels-native ASGI server with proper WebSocket support.
    # Uvicorn's websockets implementation has a known compatibility issue with
    # Django Channels: it auto-accepts the WebSocket handshake before the ASGI
    # app calls accept(), causing 'Expected websocket.send or close, got accept'.
    # Daphne handles the ASGI WebSocket protocol correctly end-to-end.
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    environment:
      - DEBUG=True
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # ─── Database backup connection (daily Celery beat task) ────────────
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${PGUSER:-sms}
      - PGPASSWORD=${PGPASSWORD:-sms_password}
      - PGDATABASE=${PGDATABASE:-sms_db}
      - SMS_BACKUP_DIR=/backups
      - SMS_BACKUP_RETENTION_DAYS=${SMS_BACKUP_RETENTION_DAYS:-30}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - FRONTEND_URL=http://localhost:5173
      - TWILIO_ACCOUNT_SID=
      - TWILIO_AUTH_TOKEN=
      - TWILIO_PHONE_NUMBER=
      - TWILIO_MESSAGING_SERVICE_SID=
      - FIREBASE_CREDENTIALS=
      - SENTRY_DSN=${SENTRY_DSN}
      # ─── Gmail SMTP (real email delivery) ───────────────────────────────
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_HOST_USER=${GMAIL_USER}
      - EMAIL_HOST_PASSWORD=${GMAIL_APP_PASSWORD}
      - DEFAULT_FROM_EMAIL=${GMAIL_USER}
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - sms_backups:/backups
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  # ─── Celery Worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
      target: development
    container_name: sms_celery
    restart: unless-stopped
    command: celery -A core worker -l info -c 4 -Q default,notifications,reports
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # ─── Database backup connection (daily Celery beat task) ────────────
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${PGUSER:-sms}
      - PGPASSWORD=${PGPASSWORD:-sms_password}
      - PGDATABASE=${PGDATABASE:-sms_db}
      - SMS_BACKUP_DIR=/backups
      - SMS_BACKUP_RETENTION_DAYS=${SMS_BACKUP_RETENTION_DAYS:-30}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-}
      - SECRET_KEY=${SECRET_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      # ─── Gmail SMTP (real email delivery) ───────────────────────────────
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_HOST_USER=${GMAIL_USER}
      - EMAIL_HOST_PASSWORD=${GMAIL_APP_PASSWORD}
      - EMAIL_USE_TLS=True
      - DEFAULT_FROM_EMAIL=${GMAIL_USER}
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
      - sms_backups:/backups
    depends_on:
      - backend
      - redis

  # ─── Celery Beat (Scheduler) ───────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
      target: development
    container_name: sms_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - TWILIO_MESSAGING_SERVICE_SID=${TWILIO_MESSAGING_SERVICE_SID}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS}
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  # ─── Celery Flower (Task monitor) ─────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
      target: development
    container_name: sms_flower
    restart: unless-stopped
    command: celery -A core flower --port=5555
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./backend:/app
    ports:
      - "5555:5555"
    depends_on:
      - redis

  # ─── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
      target: development
    container_name: sms_frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
      - REACT_APP_WS_URL=ws://localhost:8000
      # WATCHPACK_POLLING is set in frontend/web/.env to avoid hardcoding
      # in Docker. It's read at build-time by react-scripts.
    volumes:
      - ./frontend/web/src:/app/src
      - ./frontend/web/public:/app/public
      - ./frontend/web/.env:/app/.env
      - ./frontend/web/package.json:/app/package.json
      - ./frontend/web/tsconfig.json:/app/tsconfig.json
      - ./frontend/web/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/web/postcss.config.js:/app/postcss.config.js
      - ./frontend/web/.eslintrc.json:/app/.eslintrc.json
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ─── Adminer (Web-based DB GUI) ────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1
    container_name: sms_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: sms_db
      ADMINER_DEFAULT_USER: sms
      ADMINER_DEFAULT_PASSWORD: sms_password

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sms_nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - media_files:/var/www/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_files:
  sms_backups:

networks:
  default:
    name: sms_network
