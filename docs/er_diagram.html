<!DOCTYPE html>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; }
header { padding: 20px 30px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 20px; font-weight: 600; }
header .subtitle { color: #8b949e; font-size: 13px; }
header .legend { display: flex; gap: 16px; font-size: 12px; align-items: center; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; }
#mynetwork { width: 100%; height: calc(100vh - 70px); }
.vis-network:focus { outline: none; }
.tooltip { position: fixed; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-size: 12px; max-width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); pointer-events: none; display: none; z-index: 1000; }
.tooltip.visible { display: block; }
.tooltip h3 { color: #f0f6fc; margin-bottom: 4px; font-size: 14px; }
.tooltip p { color: #8b949e; margin-bottom: 2px; }
.controls { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 8px; z-index: 10; }
.controls button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.controls button:hover { background: #30363d; }
</style>
</head>

}

  return [from, to, label || '', dashes || false];
}

  edge('School', 'MealMenu', '1:N'),
  edge('School', 'MealPlan', '1:N'),
  edge('Student', 'MealBooking', '1:N'),
  edge('MealPlan', 'MealBooking', '1:N'),
  edge('Student', 'DietaryRestriction', '1:N'),
];

// ── Construct vis-network ──────────────────────────────────────────────
const nodeData = nodes.map(n => ({
  id: n.id,
  label: n.id,
  title: `<b>${n.id}</b>`,
  group: n.group,
  shape: 'box',
  margin: { top: 8, right: 12, bottom: 8, left: 12 },
  font: { color: '#fff', size: 11, face: 'Segoe UI, sans-serif', strokeWidth: 0 },
  borderWidth: 2,
  size: 20,
}));

const edgeData = edges.map(e => ({
  from: e[0], to: e[1],
  label: e[2] || '',
  dashes: e[3] || false,
  arrows: 'to',
  width: 1.2,
  color: { color: '#484f58', highlight: '#58a6ff', hover: '#58a6ff' },
  font: { color: '#8b949e', size: 9, align: 'middle', strokeWidth: 2, strokeColor: '#0d1117' },
  smooth: { type: 'curvedCW', roundness: 0.15 },
  arrowStrikethrough: false,
}));

const groupStyles = {};
for (const [key, c] of Object.entries(COLORS)) {
  groupStyles[key] = {
    shape: 'box',
    color: { background: c.bg, border: c.border, highlight: { background: c.bg, border: '#58a6ff' } },
    font: { color: c.text, size: 11 },
  };
}

const container = document.getElementById('mynetwork');
const data = { nodes: new vis.DataSet(nodeData), edges: new vis.DataSet(edgeData) };
const options = {
  autoResize: true,
  groups: groupStyles,
  edges: {
    smooth: { type: 'curvedCW', roundness: 0.15 },
  },
  physics: {
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -40,
      centralGravity: 0.005,
      springLength: 180,
      springConstant: 0.04,
      damping: 0.5,
    },
    stabilization: { iterations: 300 },
  },
  interaction: {
    hover: true,
    tooltipDelay: 200,
    navigationButtons: false,
    keyboard: true,
  },
  layout: { improvedLayout: true },
};

const network = new vis.Network(container, data, options);

// ── Controls ───────────────────────────────────────────────────────────
function zoomIn() { const s = network.getScale(); network.moveTo({ scale: s * 1.3 }); }
function zoomOut() { const s = network.getScale(); network.moveTo({ scale: s / 1.3 }); }
function fitView() { network.fit({ animation: true }); }

// ── Tooltip on click ──────────────────────────────────────────────────
network.on('click', function(params) {
  const tooltip = document.getElementById('tooltip');
  if (params.nodes.length > 0) {
    const nid = params.nodes[0];
    const n = nodes.find(x => x.id === nid);
    if (n) {
      document.getElementById('tt-title').textContent = n.id;
      document.getElementById('tt-fields').textContent = 'Fields: ' + (n.fields.length ? n.fields.join(' · ') : '-');
      const rels = edges.filter(e => e[0] === nid || e[1] === nid);
      const relStr = rels.map(r => `${r[0]} → ${r[1]}${r[2] ? ' ('+r[2]+')' : ''}`).join('  ·  ');
      document.getElementById('tt-rels').textContent = relStr ? 'Relations: ' + relStr : '';
      tooltip.classList.add('visible');
      tooltip.style.left = (params.pointer.DOM.x + 15) + 'px';
      tooltip.style.top = (params.pointer.DOM.y + 15) + 'px';
      return;
    }
  }
  tooltip.classList.remove('visible');
});

// Click outside to hide tooltip
document.addEventListener('click', function(e) {
  if (!e.target.closest('#mynetwork')) {
    document.getElementById('tooltip').classList.remove('visible');
  }
});

console.log('ER Diagram loaded: ' + nodes.length + ' entities, ' + edges.length + ' relationships');
</script>
</body>
</html>
