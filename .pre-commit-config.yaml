# See https://pre-commit.com for docs
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # k8s manifests are multi-document bundles (Namespace + Deployment +
      # Service + ... in one file) — allow multiple YAML documents per file.
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
      # npm lockfiles legitimately exceed 500KB — exclude them from the
      # added-large-files gate (they're not secrets and are diffed by npm).
      # Uses pre-commit's core per-hook exclude (not the hook's --exclude arg,
      # which isn't supported by all hook versions).
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^.*package-lock\.json$

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # Quote the comma-joined flag — an unquoted comma inside a YAML flow
        # sequence would split it, making flake8 treat "W503" as a filename.
        # F405 ignored: settings modules deliberately star-import from base.py.
        # DJ01 ignored: the codebase deliberately uses null=True on image/file
        # fields; removing it would require DB migrations with no behavior gain.
        args: [--max-line-length=120, "--extend-ignore=E203,F405,W503,DJ01"]
        additional_dependencies: [flake8-django]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, css, markdown, yaml]
        args: [--print-width=100, --trailing-comma=all, --tab-width=2, --single-quote=false]

  # ESLint is run via npm run lint in CI — skipping pre-commit hook
  # to avoid tag resolution issues with the mirrors-eslint repo.
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v8.56.0
  #   hooks:
  #     - id: eslint
  #       types: [file]
  #       files: \.(ts|tsx)$
  #       args: [--fix]
  #       additional_dependencies:
  #         - "eslint@8.56.0"
  #         - "@typescript-eslint/eslint-plugin@7.2.0"
  #         - "@typescript-eslint/parser@7.2.0"
  #         - "eslint-plugin-react@7.34.1"
  #         - "eslint-plugin-react-hooks@4.6.0"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        # Exclude paths must be a single comma-joined value; passing them as
        # separate args makes bandit treat "tests" as a scan path.
        args: [-ll, -q, "-x", "migrations,tests"]

  # Gitleaks secret scan runs in CI (security-scan job) via the OSS docker
  # image — its pre-commit hook requires the Go toolchain, so it is not wired
  # in locally to avoid breaking commits on machines without Go.

  - repo: https://github.com/djlint/djLint
    rev: v1.34.1
    hooks:
      - id: djlint-django
