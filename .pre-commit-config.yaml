# See https://pre-commit.com for docs
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=120]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --extend-ignore=E203,W503]
        additional_dependencies: [flake8-django]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, css, markdown, yaml]
        args: [--print-width=100, --trailing-comma=all, --tab-width=2, --single-quote=false]

  # ESLint is run via npm run lint in CI — skipping pre-commit hook
  # to avoid tag resolution issues with the mirrors-eslint repo.
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v8.56.0
  #   hooks:
  #     - id: eslint
  #       types: [file]
  #       files: \.(ts|tsx)$
  #       args: [--fix]
  #       additional_dependencies:
  #         - "eslint@8.56.0"
  #         - "@typescript-eslint/eslint-plugin@7.2.0"
  #         - "@typescript-eslint/parser@7.2.0"
  #         - "eslint-plugin-react@7.34.1"
  #         - "eslint-plugin-react-hooks@4.6.0"

  - repo: https://github.com/djlint/djLint
    rev: v1.34.1
    hooks:
      - id: djlint-django
