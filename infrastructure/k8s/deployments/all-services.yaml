---
# ─── Frontend Deployment ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-frontend
  namespace: sms
  labels:
    app: sms-frontend
    component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sms-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sms-frontend
        component: ui
    spec:
      containers:
        - name: frontend
          image: your-registry/sms-frontend:2.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: sms-config
                  key: FRONTEND_API_URL
            - name: REACT_APP_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: sms-config
                  key: FRONTEND_WS_URL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
# ─── Frontend Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sms-frontend-svc
  namespace: sms
spec:
  selector:
    app: sms-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP

---
# ─── PostgreSQL init scripts ──────────────────────────────────────────────────
# Mirrors infrastructure/docker/postgres/init.sql so the StatefulSet mounts
# the same extensions/tuning at first boot in Kubernetes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: sms
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";
    CREATE EXTENSION IF NOT EXISTS "unaccent";
    CREATE EXTENSION IF NOT EXISTS "btree_gist";

    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_ts_config WHERE cfgname = 'sms_search') THEN
            CREATE TEXT SEARCH CONFIGURATION sms_search (COPY = english);
        END IF;
    END
    $$;
    ALTER TEXT SEARCH CONFIGURATION sms_search
        ALTER MAPPING FOR hword, hword_part, word
        WITH unaccent, english_stem;

    ALTER SYSTEM SET shared_buffers = '256MB';
    ALTER SYSTEM SET effective_cache_size = '768MB';
    ALTER SYSTEM SET maintenance_work_mem = '64MB';
    ALTER SYSTEM SET checkpoint_completion_target = '0.9';
    ALTER SYSTEM SET wal_buffers = '16MB';
    ALTER SYSTEM SET default_statistics_target = '100';
    ALTER SYSTEM SET random_page_cost = '1.1';
    ALTER SYSTEM SET effective_io_concurrency = '200';
    ALTER SYSTEM SET work_mem = '16MB';
    ALTER SYSTEM SET max_connections = '200';

    SELECT pg_reload_conf();

---
# ─── PostgreSQL StatefulSet ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sms-postgres
  namespace: sms
spec:
  serviceName: sms-postgres
  replicas: 1
  selector:
    matchLabels:
      app: sms-postgres
  template:
    metadata:
      labels:
        app: sms-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: sms_db
            - name: POSTGRES_USER
              value: sms
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sms", "-d", "sms_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sms", "-d", "sms_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gp3"
        resources:
          requests:
            storage: 50Gi

---
# ─── PostgreSQL Service ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sms-postgres-svc
  namespace: sms
spec:
  selector:
    app: sms-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# ─── Redis StatefulSet ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sms-redis
  namespace: sms
spec:
  serviceName: sms-redis
  replicas: 1
  selector:
    matchLabels:
      app: sms-redis
  template:
    metadata:
      labels:
        app: sms-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - "--maxmemory"
            - "512mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - "60 1"
            - "--loglevel"
            - "notice"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gp3"
        resources:
          requests:
            storage: 10Gi

---
# ─── Redis Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sms-redis-svc
  namespace: sms
spec:
  selector:
    app: sms-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
# ─── Secrets Template (fill before applying) ─────────────────────────────────
# kubectl create secret generic sms-secrets --from-env-file=.env.production -n sms
apiVersion: v1
kind: Secret
metadata:
  name: sms-secrets
  namespace: sms
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_50_CHAR_RANDOM_SECRET"
  database-url: "postgresql://sms:REPLACE_PASSWORD@sms-postgres-svc:5432/sms_db"
  redis-url: "redis://sms-redis-svc:6379/0"
  postgres-password: "REPLACE_DB_PASSWORD"
  aws-access-key-id: "REPLACE_AWS_KEY"
  aws-secret-access-key: "REPLACE_AWS_SECRET"
  sentry-dsn: "REPLACE_SENTRY_DSN"
  flower-password: "REPLACE_FLOWER_PASSWORD"
  grafana-admin-password: "REPLACE_GRAFANA_ADMIN_PASSWORD"

---
# ─── Network Policy — isolate SMS namespace ───────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sms-network-policy
  namespace: sms
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sms
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    # DNS (kube-dns) + internal services only. External HTTPS egress (S3,
    # Stripe/Khalti/eSewa, SendGrid, Twilio, FCM) is allowed via the node
    # CIDR rule below — tighten to the cluster's node CIDR or use an
    # egress gateway for a stricter posture.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5555
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9121
        - protocol: TCP
          port: 9187
        - protocol: TCP
          port: 8080
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Prometheus node discovery + node-exporter scraping on the node CIDR
    # (EKS nodes default to 10.0.0.0/16 — adjust to the cluster's actual CIDR)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 9100
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
# ─── PodDisruptionBudget — ensure availability during upgrades ────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sms-backend-pdb
  namespace: sms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sms-backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sms-frontend-pdb
  namespace: sms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sms-frontend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sms-celery-pdb
  namespace: sms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sms-celery-worker
