          },
          "targets": [
            { "expr": "sms_backup_count", "legendFormat": "backup count", "interval": "5m", "exemplar": true, "refId": "A" }
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 1,
      "links": [],
      "templating": {
