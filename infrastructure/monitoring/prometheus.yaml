---
# ─── Grafana Deployment ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.3.1
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: grafana-admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "https://monitoring.edusphere.school/grafana"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: datasources
          configMap:
            name: grafana-datasources

---
# ─── Grafana Persistent Volume Claim ───────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: sms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi

---
# ─── Grafana Datasource Provisioning ───────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: sms
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

---
# ─── Grafana Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sms
spec:
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP

---
# ─── Prometheus ServiceAccount + RBAC ──────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: sms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: sms

---
# ─── Prometheus Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sms
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP

---
# ─── Node Exporter DaemonSet (scraped by the 'node' job on :9100) ───────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: sms
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0
          args:
            - "--path.rootfs=/host"
            - "--collector.textfile.directory=/host/var/lib/sms-backup-metrics"
          ports:
            - name: metrics
              containerPort: 9100
              hostPort: 9100
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
      volumes:
        - name: root
          hostPath:
            path: /

---
# ─── PostgreSQL Exporter ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://sms:$(POSTGRES_PASSWORD)@sms-postgres-svc:5432/sms_db?sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: postgres-password
          ports:
            - containerPort: 9187
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: sms
spec:
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187
  type: ClusterIP

---
# ─── Redis Exporter ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          args:
            - "--redis.addr=redis://sms-redis-svc:6379"
          ports:
            - containerPort: 9121
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9121
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: sms
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
      targetPort: 9121
  type: ClusterIP

---
# ─── Alertmanager ──────────────────────────────────────────────────────────────
# Config template. The ${ALERTMANAGER_SMTP_PASSWORD} placeholder is rendered by
# the config-render initContainer below using the smtp-password key of the
# sms-secrets Secret (see infrastructure/k8s/deployments/all-services.yaml).
# Fill in the SMTP smarthost/from/recipient placeholders here (non-secret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: sms
data:
  alertmanager.yml.tpl: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: "REPLACE_SMTP_HOST:587"   # e.g. smtp.gmail.com:587
      smtp_from: "REPLACE_ALERT_FROM_EMAIL"
      smtp_auth_username: "REPLACE_SMTP_USERNAME"
      smtp_auth_password: "${ALERTMANAGER_SMTP_PASSWORD}"
      smtp_require_tls: true
    route:
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "email"
    receivers:
      - name: "email"
        email_configs:
          - to: "REPLACE_ALERT_RECIPIENT_EMAIL"
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      initContainers:
        # Render the SMTP password (from sms-secrets) into the config: Alertmanager
        # does not expand env vars in its config file, so the template is substituted
        # before the main container starts. Requires outbound registry access to
        # fetch gettext on the alpine image — failure is loud (pod won't start).
        - name: config-render
          image: alpine:3.19
          env:
            - name: ALERTMANAGER_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: smtp-password
          command: ["sh", "-c"]
          args:
            - |
              apk add --no-cache gettext >/dev/null 2>&1
              envsubst < /etc/alertmanager-tpl/alertmanager.yml.tpl > /etc/alertmanager-cfg/alertmanager.yml
          volumeMounts:
            - name: config-tpl
              mountPath: /etc/alertmanager-tpl
              readOnly: true
            - name: config-rendered
              mountPath: /etc/alertmanager-cfg
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager-cfg/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config-rendered
              mountPath: /etc/alertmanager-cfg
              readOnly: true
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: config-tpl
          configMap:
            name: alertmanager-config
        - name: config-rendered
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: sms
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
  type: ClusterIP

---
# ─── Monitoring Ingress ────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sms-monitoring-ingress
  namespace: sms
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - monitoring.edusphere.school
      secretName: sms-monitoring-tls-secret
  rules:
    - host: monitoring.edusphere.school
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
            annotations:
              nginx.ingress.kubernetes.io/auth-type: basic
              nginx.ingress.kubernetes.io/auth-secret: sms-monitoring-auth
              nginx.ingress.kubernetes.io/auth-realm: "Monitoring Access"
          - path: /alertmanager
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093
            annotations:
              nginx.ingress.kubernetes.io/auth-type: basic
              nginx.ingress.kubernetes.io/auth-secret: sms-monitoring-auth
              nginx.ingress.kubernetes.io/auth-realm: "Monitoring Access"

---
# ─── Monitoring basic auth secret (protects /prometheus + /alertmanager) ──────
# Generate the htpasswd value locally, e.g.  htpasswd -nb <user> <password>
# then paste the full "<user>:<hash>" line into the `auth` key below.
apiVersion: v1
kind: Secret
metadata:
  name: sms-monitoring-auth
  namespace: sms
type: Opaque
stringData:
  auth: "REPLACE_MONITORING_USER:REPLACE_MONITORING_PASSWORD_HASH"

---
# ─── kube-state-metrics ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.1
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: sms
spec:
  selector:
    app: kube-state-metrics
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
