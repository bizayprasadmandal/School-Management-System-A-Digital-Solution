# ─── Prometheus ConfigMap ─────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sms
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: sms-production
        environment: production

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # Django backend metrics (django-prometheus)
      - job_name: sms-backend
        static_configs:
          - targets: ["sms-backend-svc:80"]
        metrics_path: /metrics
        scrape_interval: 30s

      # Celery metrics (via Flower or custom exporter)
      - job_name: sms-celery
        static_configs:
          - targets: ["sms-flower:5555"]
        metrics_path: /metrics
        scrape_interval: 30s

      # PostgreSQL metrics
      - job_name: postgres
        static_configs:
          - targets: ["postgres-exporter:9187"]

      # Redis metrics
      - job_name: redis
        static_configs:
          - targets: ["redis-exporter:9121"]

      # Node-level metrics (Kubernetes node exporter)
      - job_name: node
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            replacement: '${1}:9100'
            target_label: __address__

      # Backup metrics via node_exporter textfile collector
      # The backup_metrics.sh script (infrastructure/db/backup_metrics.sh)
      # writes to node_exporter's --collector.textfile.directory, which
      # is served alongside /metrics on port 9100.
      - job_name: sms-backup
        kubernetes_sd_configs:
          - role: pod
            selectors:
              - role: pod
                label: app.kubernetes.io/component=backup
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: backup
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '9100'
            action: keep
        metrics_path: /metrics
        # If pod autodiscovery is not available, fall back to a static target:
        # static_configs:
        #   - targets: ["backup-host:9100"]

      # Alternatively, scrape backup metrics from the same node exporter
      # that is already in the 'node' job above.  The textfile collector
      # automatically exposes files in its directory alongside the normal
      # node exporter metrics, so no extra job is strictly needed — the
      # 'sms_backup_*' metrics will appear under the 'node' job.  This
      # separate job exists for dedicated backup hosts that run only the
      # textfile collector, not the full node exporter.

  rules/sms_alerts.yml: |
    groups:
      - name: sms_critical
        rules:
          # Backend is down
          - alert: BackendDown
            expr: up{job="sms-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "SMS Backend is unreachable"
              description: "The backend API has been down for more than 1 minute."

          # High error rate
          - alert: HighErrorRate
            expr: |
              rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]) /
              rate(django_http_responses_total_by_status_total[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP error rate (>5%)"

          # Database connection pool exhaustion
          - alert: DBConnectionPoolExhausted
            expr: django_db_execute_total > 10000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Database connection pool nearing exhaustion"

          # Redis memory pressure
          - alert: RedisHighMemory
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Redis memory usage above 85%"

          # Celery task queue backed up
          - alert: CeleryQueueBacklog
            expr: celery_queue_length > 500
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Celery task queue has >500 pending tasks"

          # Disk space
          - alert: DiskSpaceLow
            expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Disk space below 15%"

          # Pod crash looping
          - alert: PodCrashLooping
            expr: kube_pod_container_status_restarts_total > 5
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash-looping"

---
# ─── Prometheus Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}

---
# ─── Grafana Dashboard Provisioning ConfigMap ──────────────────────────────────
# Contains both the provider config (dashboards.yaml) and dashboard JSON files.
# Mounted by the Grafana Deployment below at /etc/grafana/provisioning/dashboards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: sms
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: "SMS Backup Dashboards"
        orgId: 1
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: true

      - name: "SMS Default Dashboards"
        orgId: 1
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true

  backup_metrics.json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "Prometheus data source",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "title": "Backup Monitoring",
      "description": "Database backup health dashboard — age, size, verification status, retention, and growth trends. Metrics exported by the node_exporter textfile collector (backup_metrics.sh).",
      "tags": ["sms", "backup", "database", "production"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 0,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m", "15m", "30m", "1h", "2h", "1d"]
      },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "title": "Backup Freshness",
          "description": "Normalised freshness score (1.0 = fresh backup < 1 hour, 0.0 = no backup or very old)",
          "type": "gauge",
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "horizontal",
            "showThresholdLabels": true,
            "showThresholdMarkers": true,
            "minVizHeight": 75,
            "minVizWidth": 75
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.3 },
                  { "color": "yellow", "value": 0.6 },
                  { "color": "green", "value": 0.85 }
                ]
              },
              "color": { "mode": "thresholds" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "job:sms_backup_freshness:ratio", "legendFormat": "{{ instance }}", "interval": "", "exemplar": false, "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Backup Age",
          "description": "Age of the latest backup file in hours",
          "type": "stat",
          "gridPos": { "h": 7, "w": 4, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 3600 },
                  { "color": "red", "value": 129600 }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": [
                { "type": "value", "value": "9999", "options": { "9999": { "text": "No backup", "color": "red" } } }
              ]
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sms_backup_age_hours * 3600", "legendFormat": "{{ instance }}", "interval": "", "exemplar": false, "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Verification Status",
          "description": "1 = last verification passed and fresh (< 2h), 0 = not verified or stale",
          "type": "stat",
          "gridPos": { "h": 7, "w": 4, "x": 10, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.5 }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": [
                { "type": "value", "value": "1", "options": { "1": { "text": "Verified", "color": "green" } } },
                { "type": "value", "value": "0", "options": { "0": { "text": "Stale / Failed", "color": "red" } } }
              ]
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sms_backup_verify_status", "legendFormat": "{{ instance }}", "interval": "", "exemplar": false, "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Backup Count",
          "description": "Total backup files in the backup directory",
          "type": "stat",
          "gridPos": { "h": 7, "w": 4, "x": 14, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "color": { "mode": "thresholds" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sms_backup_count", "legendFormat": "{{ instance }}", "interval": "", "exemplar": false, "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Oldest Backup",
          "description": "Age of the oldest backup file in days — indicates retention coverage",
          "type": "stat",
          "gridPos": { "h": 7, "w": 4, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 7 },
                  { "color": "yellow", "value": 30 },
                  { "color": "green", "value": 60 }
                ]
              },
              "color": { "mode": "thresholds" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sms_backup_oldest_days", "legendFormat": "{{ instance }}", "interval": "", "exemplar": false, "refId": "A" }
          ]
        },
        {
          "id": 6,
          "title": "Backup Age — 7 Day History",
          "description": "Backup file age over time. Sustained high values indicate backup job failures.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["max", "min", "lastNotNull"], "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 3600 },
                  { "color": "red", "value": 129600 }
                ]
              },
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "stepBefore",
                "lineWidth": 2,
                "pointSize": 2,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "line" }
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sms_backup_age_hours * 3600", "legendFormat": "backup age", "interval": "5m", "exemplar": true, "refId": "A" },
            { "expr": "129600", "legendFormat": "P1 threshold (36h)", "interval": "", "exemplar": false, "refId": "B" }
          ]
        },
        {
          "id": 7,
          "title": "Backup Size — 30 Day History",
          "description": "Latest backup file size over time. Useful for detecting corruption (sudden drops) or unexpected growth.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["max", "min", "lastNotNull", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1000000 }
                ]
              },
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 30,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "stepBefore",
                "lineWidth": 2,
                "pointSize": 2,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "line" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "P2 threshold (1MB)" },
                "properties": [
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.lineWidth", "value": 1 },
                  { "id": "custom.lineInterpolation", "value": "linear" },
                  { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }
                ]
              }
            ]
          },
          "targets": [
            { "expr": "sms_backup_size_bytes", "legendFormat": "backup size", "interval": "5m", "exemplar": true, "refId": "A" },
            { "expr": "1000000", "legendFormat": "P2 threshold (1MB)", "interval": "", "exemplar": false, "refId": "B" }
          ]
        },
        {
          "id": 8,
          "title": "Backup Verification Timeline",
          "description": "Green = verification passing, Red = verification stale/failing",
          "type": "state-timeline",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.5 }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": [
                { "type": "value", "value": "1", "options": { "1": { "text": "Verified", "color": "green" } } },
                { "type": "value", "value": "0", "options": { "0": { "text": "Stale / Failed", "color": "red" } } }
              ],
              "custom": {
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineWidth": 0,
                "fillOpacity": 100
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sms_backup_verify_status", "legendFormat": "{{ instance }}", "interval": "5m", "exemplar": true, "refId": "A" }
          ]
        },
        {
          "id": 9,
          "title": "Backup Growth Rate",
          "description": "7-day rate of change in backup file size. Sustained positive slope indicates database growth.",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["max", "mean", "lastNotNull"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 25000000 },
                  { "color": "red", "value": 50000000 }
                ]
              },
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": true,
                "axisColorMode": "text",
                "axisLabel": "bytes/day",
                "axisPlacement": "auto",
                "drawStyle": "bars",
                "fillOpacity": 80,
                "gradientMode": "scheme",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 2,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "line" }
              }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "job:sms_backup_growth_bytes_per_day:rate", "legendFormat": "daily growth", "interval": "1d", "exemplar": true, "refId": "A" },
            { "expr": "50000000", "legendFormat": "P3 threshold (50 MB/day)", "interval": "", "exemplar": false, "refId": "B" }
          ]
        },
        {
          "id": 10,
          "title": "Backup Retention — Oldest Backup Age",
          "description": "Age of the oldest retained backup. Should be >= 90 days for compliance.",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["max", "min", "lastNotNull"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 7 },
                  { "color": "yellow", "value": 30 },
                  { "color": "green", "value": 60 }
                ]
              },
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "days",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 30,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "stepBefore",
                "lineWidth": 2,
                "pointSize": 2,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "line" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Target 90d" },
                "properties": [
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.lineWidth", "value": 1 },
                  { "id": "custom.lineInterpolation", "value": "dashed" },
                  { "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }
                ]
              }
            ]
          },
          "targets": [
            { "expr": "sms_backup_oldest_days", "legendFormat": "oldest backup", "interval": "5m", "exemplar": true, "refId": "A" },
            { "expr": "90", "legendFormat": "Target 90d", "interval": "", "exemplar": false, "refId": "B" }
          ]
        },
        {
          "id": 11,
          "title": "Backup File Count — 30 Day History",
          "description": "Total backup files in the directory. Should remain stable if retention pruning is working correctly.",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "options": {
