events { worker_connections 1024; }

http {
  # ── Rate limiting zones ───────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=100r/m;
  limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ── Upstreams ─────────────────────────────────────────────────────────
  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;
    client_max_body_size 50M;

    # ── Security headers ────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws://localhost:8000 http://localhost:8000 http://localhost:3000;" always;

    # ── Login rate limit (strict) ───────────────────────────────────────
    location /api/v1/auth/login/ {
      limit_req zone=login_limit burst=5 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API (general rate limit) ────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      limit_conn conn_limit 20;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /graphql/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # ── WebSocket (no rate limiting) ────────────────────────────────────
    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /admin/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # ── Frontend SPA ────────────────────────────────────────────────────
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
    }
  }
}
