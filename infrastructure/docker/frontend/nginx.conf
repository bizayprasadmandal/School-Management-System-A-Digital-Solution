server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nonce-based CSP: script-src allows only 'self' bundles plus inline scripts
    # stamped with a fresh per-request nonce ($request_id). 'unsafe-inline' is
    # removed so attacker-injected scripts can never execute. The matching nonce
    # attribute is stamped onto the inline loader <script> in index.html by
    # sub_filter below. style-src keeps 'unsafe-inline' for the inline critical
    # CSS block (style directives cannot execute code).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: ws: https:;" always;

    # Per-request nonce stamping: turn the inline loader script's opening tag
    # into '<script nonce="$request_id">' so it matches the CSP header above.
    # CRA bundle tags start with '<script defer' and are external 'self' scripts
    # — they need no nonce, and sub_filter_once only rewrites the first exact
    # '<script>' match, which is the inline loader.
    # Double quotes on the nginx args are REQUIRED: nginx only interpolates
    # variables in double-quoted config strings — single quotes would stamp the
    # literal text "$request_id" into the HTML and break the nonce match. The
    # HTML attribute itself uses single quotes so it needs no escaping.
    sub_filter "<script>" "<script nonce='$request_id'>";
    sub_filter_once on;
    sub_filter_types text/html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html. Note: add_header on this level REPLACES the
    # server-level headers for this location, so the security headers (incl.
    # the nonce CSP) must be repeated here — otherwise index.html, the only
    # document the CSP matters on, would be served with no CSP at all.
    location = /index.html {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: ws: https:;" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
